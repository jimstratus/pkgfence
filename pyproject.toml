[project]
name = "pkgfence"
version = "0.5.0"
description = "Multi-codebase dependency and supply-chain vulnerability scanner — Claude Code skill"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "ruamel.yaml==0.19.1",
    "httpx[http2]==0.28.1",
    "jsonschema==4.26.0",
    "portalocker==3.2.0",
    "cvss==3.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
]

[project.scripts]
pkgfence = "scripts.scan_command:main"
pkgfence-lookup = "scripts.lookup_command:main"
pkgfence-notify = "scripts.notify:main"
pkgfence-watch = "scripts.watch_daemon:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*"]
exclude = ["config*", "planning*", "references*", "tests*", "fixtures*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --strict-markers"
